[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "my-stock-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.3,<2",
    "pydantic>=2.11,<3",
    "typer>=0.16,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "pytest-cov>=6.2,<7",
    "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/stock_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
